name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      # A real `code` binary, because without one the tests that actually run
      # a scaffolded app are silently skipped (they are gated on
      # EUGLENA_TEST_CODE_BIN) — which is how the v0.4 -> v1.1 syntax drift
      # this repo went through shipped unnoticed in the first place. See
      # docs/tickets/17-release-0-2-0.md.
      #
      # Pinned to `src/exec.rs`'s MIN_CODE_VERSION — bump together. Testing
      # against the oldest supported `code` is what catches an accidental
      # dependency on a newer one, and it only works while the two agree:
      # this pin sat at v1.1.3 after the minimum moved to 1.4.0, so every
      # test needing a binary ran three minor versions behind and failed.
      #
      # They agree again, and the minimum is now a version that was actually
      # published — 1.4.0 never was, which is part of how the drift went
      # unnoticed. See `MIN_CODE_VERSION` for why that decided the number.
      - name: Download code (v1.8.0)
        run: |
          set -euo pipefail
          curl -sSfL -o code.tar.gz \
            https://github.com/codelovesme/code/releases/download/v1.8.0/code-v1.8.0-x86_64-linux.tar.gz
          tar -xzf code.tar.gz

      - name: Test
        env:
          EUGLENA_TEST_CODE_BIN: ${{ github.workspace }}/code-v1.8.0-x86_64-linux/code
        run: cargo test
