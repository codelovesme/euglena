name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same minimum this repo targets (src/exec.rs's
      # MIN_CODE_VERSION) — bump both together. Without this check the site's
      # examples can silently drift out of sync with the language, which is
      # exactly what happened across the v0.4 -> v1.1 migration (see
      # docs/tickets/16-readme-and-site.md).
      - name: Download code (v1.1.3)
        run: |
          set -euo pipefail
          curl -sSfL -o code.tar.gz \
            https://github.com/codelovesme/code/releases/download/v1.1.3/code-v1.1.3-x86_64-linux.tar.gz
          tar -xzf code.tar.gz

      - name: Check site examples are current, canonical Code
        run: ./code-v1.1.3-x86_64-linux/code format --check site/examples/

      - name: Assemble dist
        run: python3 site/build.py . site/dist

      - name: Check placeholder replaced
        run: |
          if grep -q "__EXAMPLES__" site/dist/index.html; then
            echo "::error::__EXAMPLES__ placeholder still present in dist"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy-site:
    name: Deploy to GitHub Pages
    needs: build-site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
