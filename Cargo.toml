[package]
name = "euglena-cli"
version = "0.4.0"
edition = "2021"
description = "CLI to scaffold, run, and build Euglena applications"
license = "GPL-3.0-or-later"
repository = "https://github.com/codelovesme/euglena"
readme = "README.md"

[[bin]]
name = "euglena"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
